[package]
name = "inna-auth"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "inna-auth"
path = "src/main.rs"

[dependencies]
inna-core = { path = "../inna-core" }
serde = { workspace = true }
serde_json = { workspace = true }
