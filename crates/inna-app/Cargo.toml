[package]
name = "inna-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "anni"
path = "src/main.rs"

[dependencies]
inna-core = { path = "../inna-core" }
inna-cache = { path = "../inna-cache" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
clap = { version = "4", features = ["derive"] }
reqwest = { workspace = true }
axum = "0.7"
percent-encoding = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }

[target.'cfg(windows)'.dev-dependencies]
winit = { version = "0.30", default-features = false }
